<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>zod4-mock · Subject Builder Wireframes</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <!-- Sketchy fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Architects+Daughter&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --ink: #1a1a1a;
        --ink-soft: #444;
        --ink-faint: #888;
        --paper: #f6f3ec;
        --paper-2: #ecead9;
        --rule: #1a1a1a;
        --accent: #d24a2a; /* the one accent */
        --accent-soft: #f3c2b2;
        --warn: #c98a1a;
        --hand: "Architects Daughter", "Caveat", cursive;
        --hand-bold: "Caveat", cursive;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      html,
      body {
        background: var(--paper);
        margin: 0;
        color: var(--ink);
      }
      body {
        font-family: var(--hand);
      }

      /* Sketchy primitives ---------------------------------- */
      .frame {
        border: 1.5px solid var(--ink);
        border-radius: 6px;
        background: #fff;
        position: relative;
      }
      .frame.dashed {
        border-style: dashed;
      }
      .frame.thick {
        border-width: 2.25px;
      }
      .frame.tilt-l {
        transform: rotate(-0.25deg);
      }
      .frame.tilt-r {
        transform: rotate(0.25deg);
      }

      .pane {
        border: 1.5px solid var(--ink);
        border-radius: 8px;
        background: #fff;
        position: relative;
        overflow: hidden;
      }
      .pane > .pane-tab {
        position: absolute;
        top: -10px;
        left: 16px;
        background: var(--paper);
        padding: 0 8px;
        font-family: var(--hand-bold);
        font-size: 16px;
        color: var(--ink);
        border: 1.5px solid var(--ink);
        border-radius: 12px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px dashed #c8c4b6;
      }
      .row:last-child {
        border-bottom: none;
      }
      .row .grip {
        color: var(--ink-faint);
        font-size: 14px;
        cursor: grab;
        user-select: none;
      }

      .pill,
      .input,
      .dropdown,
      .btn,
      .toggle {
        border: 1.25px solid var(--ink);
        border-radius: 14px;
        background: #fff;
        font-family: var(--hand);
        font-size: 14px;
        padding: 2px 10px;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        line-height: 1.4;
      }
      .input {
        background: #fff;
        border-radius: 4px;
        border-style: solid;
        min-width: 80px;
      }
      .input.placeholder {
        color: var(--ink-faint);
        font-style: italic;
      }
      .dropdown {
        border-radius: 4px;
        background: #faf7ee;
      }
      .dropdown::after {
        content: "▾";
        font-size: 11px;
        margin-left: 6px;
        color: var(--ink-soft);
      }
      .btn {
        background: #fff;
        cursor: pointer;
        border-style: dashed;
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        border-style: solid;
      }
      .toggle {
        border-radius: 14px;
        padding: 1px 4px 1px 4px;
        gap: 4px;
        font-size: 12px;
        background: #f3efe2;
      }
      .toggle .knob {
        width: 22px;
        height: 12px;
        border: 1.25px solid var(--ink);
        border-radius: 8px;
        background: #fff;
        position: relative;
      }
      .toggle .knob::after {
        content: "";
        position: absolute;
        top: 1px;
        left: 1px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ink);
      }
      .toggle.on .knob {
        background: var(--accent-soft);
      }
      .toggle.on .knob::after {
        left: auto;
        right: 1px;
        background: var(--accent);
      }

      .badge {
        font-family: var(--mono);
        font-size: 11px;
        border: 1.25px solid var(--ink);
        border-radius: 3px;
        padding: 1px 5px;
        background: #fff;
      }
      .badge.accent {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .badge.soft {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }

      .label-h {
        font-family: var(--hand-bold);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .label-sub {
        font-family: var(--hand);
        color: var(--ink-soft);
        font-size: 14px;
      }
      .mono {
        font-family: var(--mono);
        font-size: 12px;
      }

      /* Annotation system ----------------------------------- */
      .anno {
        position: absolute;
        font-family: var(--hand);
        color: var(--accent);
        font-size: 15px;
        line-height: 1.2;
        max-width: 200px;
        pointer-events: none;
        z-index: 5;
      }
      .anno.ink {
        color: var(--ink);
      }
      .anno strong {
        font-family: var(--hand-bold);
        font-weight: 700;
      }
      .anno-arrow {
        position: absolute;
        pointer-events: none;
        z-index: 4;
      }
      .anno-arrow svg {
        overflow: visible;
      }
      body.no-annos .anno,
      body.no-annos .anno-arrow {
        display: none;
      }

      /* Sketchy hatching for "selected" / hover ------------ */
      .hatched {
        background-image: repeating-linear-gradient(
          45deg,
          rgba(210, 74, 42, 0.1) 0 2px,
          transparent 2px 6px
        );
      }
      .hatched-ink {
        background-image: repeating-linear-gradient(
          45deg,
          rgba(0, 0, 0, 0.05) 0 2px,
          transparent 2px 6px
        );
      }

      /* Tree guide lines ----------------------------------- */
      .tree {
        position: relative;
      }
      .tree .nest {
        margin-left: 22px;
        padding-left: 18px;
        border-left: 1.25px dashed var(--ink);
        position: relative;
      }
      .tree .nest::before {
        content: "";
        position: absolute;
        left: -1.25px;
        top: 0;
        width: 12px;
        height: 14px;
        border-bottom: 1.25px dashed var(--ink);
      }

      /* Connection arrow used in binding panel */
      .conn {
        position: absolute;
        pointer-events: none;
        z-index: 3;
      }

      /* Misc --------------------------------------------- */
      .muted {
        color: var(--ink-faint);
      }
      .stamp {
        font-family: var(--hand-bold);
        color: var(--accent);
        border: 2px solid var(--accent);
        padding: 2px 8px;
        border-radius: 4px;
        transform: rotate(-4deg);
        display: inline-block;
        font-size: 12px;
        letter-spacing: 1px;
      }

      /* Scrollbars in cards: hide */
      .pane *::-webkit-scrollbar {
        display: none;
      }
      .pane * {
        scrollbar-width: none;
      }

      /* dotted callout circle */
      .ring {
        position: absolute;
        border: 2px dashed var(--accent);
        border-radius: 999px;
        pointer-events: none;
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <!-- React + Babel -->
    <script

      crossorigin="anonymous"
    ></script>
    <script

      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="design-canvas.jsx"></script>
    <script type="text/babel" src="tweaks-panel.jsx"></script>
    <script type="text/babel" src="wf-primitives.jsx"></script>
    <script type="text/babel" src="wf-direction-a.jsx"></script>
    <script type="text/babel" src="wf-direction-a-extras.jsx"></script>
    <script type="text/babel" src="wf-modifier-addremove.jsx"></script>
    <script type="text/babel" src="wf-direction-b.jsx"></script>
    <script type="text/babel" src="wf-direction-c.jsx"></script>
    <script type="text/babel" src="wf-substates.jsx"></script>
    <script type="text/babel" src="wf-global-overview.jsx"></script>
    <script type="text/babel" src="wf-app.jsx"></script>

    <div id="root"></div>
  </body>
</html>
